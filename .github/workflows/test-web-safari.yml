name: Safari Dual Subtitle Visual Probe

on:
  push:
    branches:
      - test/safari-dual-subtitles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari:
    name: Safari native caption rendering
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Enable Safari remote automation
        run: |
          sudo /usr/bin/safaridriver --enable
          /usr/bin/safaridriver --version
          defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString || true
      - name: Install visual test tools
        run: |
          python3 -m venv .safari-probe-venv
          .safari-probe-venv/bin/python -m pip install --quiet selenium pillow imageio-ffmpeg
      - name: Compare actual Safari caption rendering
        timeout-minutes: 8
        run: .safari-probe-venv/bin/python test/tools/safari_dual_track_visual_probe.py
      - name: Upload Safari screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-subtitle-screenshots
          path: safari-screenshots/*.png
          if-no-files-found: ignore
