name: Guide pin synchronization smoke test

on:
  push:
    branches:
      - ci/wizard-v4-mid-session-pins-20261121

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Read Flutter version
        run: |
          version=$(sed -n "s/^  FLUTTER_VERSION: '\(.*\)'$/\1/p" .github/workflows/build.yml)
          if [ -z "$version" ]; then
            echo "Flutter version is missing from build.yml"
            exit 1
          fi
          echo "FLUTTER_VERSION=$version" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - name: Run guide pin synchronization tests
        run: |
          flutter pub get
          flutter test test/data/services/plugin_sync_service_loop_test.dart --reporter expanded
