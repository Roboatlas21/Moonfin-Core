name: Media3 Secondary Subtitle Failure Probe

on:
  push:
    branches:
      - test/media3-secondary-failure-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media3:
    name: Media3 failure-injection JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - name: Resolve Flutter plugins
        run: flutter pub get
      - name: Simulate a failing secondary subtitle with an independent video loader
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :moonfin_native_video:testDebugUnitTest --tests 'org.moonfin.nativevideo.subtitle.TimeOffsetMediaPeriodTest' --no-daemon --console=plain
