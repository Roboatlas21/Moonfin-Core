name: Media3 Secondary Subtitle Failure Probe

on:
  push:
    branches:
      - test/media3-secondary-failure-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media3:
    name: Media3 failure-injection JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - name: Resolve Flutter plugins
        run: flutter pub get
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Configure Flutter and Android paths
        run: |
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_HOME" > android/local.properties
      - name: Simulate a failing secondary subtitle with an independent video loader
        run: |
          gradle -p android :moonfin_native_video:testDebugUnitTest --tests 'org.moonfin.nativevideo.subtitle.TimeOffsetMediaPeriodTest' --tests 'org.moonfin.nativevideo.subtitle.Media3SecondaryHttpFailureIntegrationTest' --no-daemon --console=plain
