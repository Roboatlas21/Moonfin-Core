name: Web Dual Subtitle Browser Tests

on:
  push:
    branches:
      - test/web-dual-subtitles-browser
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome:
    name: Chrome subtitle regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Test subtitle delivery URL resolution and startup metadata
        run: flutter test --reporter expanded test/playback/media_stream_resolver_indices_test.dart test/playback/backend_payload_external_subtitles_test.dart
      - name: Test Web secondary subtitle rendering in Chrome
        run: flutter test --platform chrome --reporter expanded test/playback/html_video_secondary_subtitle_test.dart test/playback/web_overlay_loader_retry_test.dart
      - name: Build WebAssembly release
        run: flutter build web --wasm --release
