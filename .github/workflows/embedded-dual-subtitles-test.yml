name: Dual subtitle checks

on:
  push:
    branches: [fix/android-embedded-dual-subtitles]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - name: Check browser subtitle selection and timing
        run: flutter test --platform chrome test/playback/html_video_secondary_subtitle_test.dart
      - name: Analyze browser subtitles
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/playback/html_video_backend_web.dart test/playback/html_video_secondary_subtitle_test.dart
      - name: Build web bundle
        run: flutter build web --wasm --release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - name: Check subtitle routing
        run: flutter test test/playback/subtitle_style_test.dart test/playback/appletv_secondary_subtitle_controls_test.dart test/playback/apple_pending_subtitle_test.dart test/playback/aether_secondary_subtitle_test.dart test/playback/aether_stall_payload_test.dart test/playback/backend_payload_external_subtitles_test.dart test/playback/media3_declared_subtitles_test.dart test/playback/media_kit_pending_subtitle_test.dart test/playback/media_kit_player_backend_subtitle_error_test.dart test/playback/media_kit_player_backend_subtitle_background_test.dart
      - name: Check shared subtitle controls
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/playback/subtitle_style.dart lib/playback/appletv_secondary_subtitles.dart lib/playback/appletv_backend.dart lib/ui/screens/playback/appletv_player_host_screen.dart lib/ui/screens/playback/appletv_livetv_player_host_screen.dart lib/playback/aether_backend.dart lib/playback/media_kit_player_backend.dart lib/ui/widgets/playback/track_picker.dart lib/ui/screens/playback/video_player_screen.dart lib/ui/widgets/playback/secondary_subtitle_appearance_footer.dart
      - name: Build phone APK
        env:
          MOONFIN_TEST_ID_SUFFIX: .dualsubtitletest
        run: flutter build apk --release --flavor mobile --target-platform android-arm64 --dart-define=DISTRIBUTION_CHANNEL=apk
      - name: Check native selection and timing
        working-directory: android
        run: ./gradlew :moonfin_native_video:testDebugUnitTest --tests '*DualSubtitleTrackSelectorTest' --tests '*TimeOffsetMediaPeriodTest' --tests '*SidecarSecondarySubtitleTest' --tests '*SubtitleOffsetPolicyTest' --tests '*SubtitleLayoutPlannerTest'
      - uses: actions/upload-artifact@v4
        with:
          name: Moonfin-Android-embedded-dual-subtitles
          path: build/app/outputs/flutter-apk/app-mobile-release.apk

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: flutter pub get
      - name: Configure iOS simulator build
        run: flutter build ios --simulator --debug --config-only
      - name: Build iOS and test native subtitle overlays
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -only-testing:RunnerTests/RunnerTests CODE_SIGNING_ALLOWED=NO

  tvos:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FLUTTER_TVOS_REF: v3.47.2-tvos.1.10.0
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install tvOS platform
        run: |
          sudo xcodebuild -runFirstLaunch || true
          for i in 1 2 3 4 5 6; do
            if xcodebuild -downloadPlatform tvOS; then
              exit 0
            fi
            echo "downloadPlatform attempt $i failed, retrying in 25s"
            sleep 25
          done
          echo "::error::tvOS platform install failed after 6 attempts"
          exit 1
      - name: Cache flutter-tvos toolchain
        id: cache-fluttertvos
        uses: actions/cache@v4
        with:
          path: ~/flutter-tvos
          key: flutter-tvos-${{ env.FLUTTER_TVOS_REF }}-${{ runner.os }}-arm64
      - name: Install flutter-tvos
        if: steps.cache-fluttertvos.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$FLUTTER_TVOS_REF" \
            https://github.com/fluttertv/flutter-tvos.git "$HOME/flutter-tvos"
      - name: Add flutter-tvos to PATH and precache
        run: |
          echo "$HOME/flutter-tvos/bin" >> "$GITHUB_PATH"
          "$HOME/flutter-tvos/bin/flutter-tvos" precache
      - name: Resolve dependencies
        run: flutter-tvos pub get
      - name: Prepare Flutter build settings
        run: |
          flutter-tvos build tvos --release --no-tree-shake-icons --dart-define=MOONFIN_TVOS=true || true
          test -f tvos/Flutter/Generated.xcconfig
          grep -q '^FLUTTER_ROOT=' tvos/Flutter/Generated.xcconfig \
            || echo "FLUTTER_ROOT=$HOME/flutter-tvos" >> tvos/Flutter/Generated.xcconfig
      - name: Install pods
        env:
          LC_ALL: en_US.UTF-8
        run: |
          python3 tvos/scripts/restore_tvos_plugins.py
          cd tvos && pod install
      - name: Stage flutter_assets for the Xcode copy phase
        run: |
          DEST="tvos/Flutter/flutter_assets"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          SRC_APP=$(find build/tvos -maxdepth 3 -type d -path "*Release-appletvos/Runner.app/flutter_assets" | head -1)
          if [ -n "$SRC_APP" ]; then
            rsync -a "$SRC_APP/" "$DEST/"
          else
            rsync -a \
              --exclude='*-appletvos' --exclude='*-appletvsimulator' \
              --exclude='aot' --exclude='.last_build_id' \
              --exclude='kernel_blob.bin' --exclude='vm_snapshot_data' \
              --exclude='isolate_snapshot_data' \
              build/tvos/ "$DEST/"
          fi
          test -f "$DEST/fonts/MaterialIcons-Regular.otf" \
            || { echo "::error::MaterialIcons font missing from staged flutter_assets"; exit 1; }
          test -f "$DEST/AssetManifest.bin" \
            || { echo "::error::AssetManifest.bin missing from staged flutter_assets"; exit 1; }
      - name: Build unsigned app
        run: |
          xcodebuild \
            -workspace tvos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk appletvos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            build
