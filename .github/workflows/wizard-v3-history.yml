name: Correct Wizard V3 commit attribution

on:
  push:
    branches:
      - ci/wizard-v3-history-build-20261120

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Attribute V3 commits to the original PR author
        run: |
          python3 scripts/ci/reattribute_wizard_v3.py
